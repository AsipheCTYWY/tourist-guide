<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tourist Guide</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Tourist Guide</h1>
    <p>Discover amazing places to visit</p>
    <div class="header-account">
      <span id="signed-in-name" class="signed-in-name" hidden></span>
      <button id="auth-open-btn" class="auth-open-btn" type="button">Sign in</button>
      <button id="auth-signout-btn" class="auth-signout-btn" type="button" hidden>Sign out</button>
    </div>
  </header>

  <main>
    <!-- Search and Filters -->
    <section class="search-section">
      <div class="search-container">
        <input
          type="text"
          id="search-input"
          placeholder="Search destinations by name..."
        >
      </div>
    </section>

    <section class="filters">
      <button class="filter-btn active" data-category="all">All</button>
      <button class="filter-btn" data-category="food">🍽️ Food</button>
      <button class="filter-btn" data-category="sightseeing">🏛️ Sightseeing</button>
      <button class="filter-btn" data-category="nightlife">🌙 Nightlife</button>
      <button class="filter-btn" data-category="adventure">🏔️ Adventure</button>
      <button class="filter-btn" data-category="nature">🌿 Nature</button>
    </section>

    <section class="destinations" id="destinations">
      <!-- Destinations will be rendered here -->
    </section>

    <div id="destination-modal" class="destination-modal" hidden>
      <section class="destination-modal-panel" role="dialog" aria-modal="true" aria-labelledby="destination-modal-title">
        <button class="destination-modal-close" type="button" aria-label="Close details">&times;</button>
        <div id="destination-modal-content"></div>
      </section>
    </div>

    <div id="auth-modal" class="auth-modal" hidden>
      <section class="auth-card" role="dialog" aria-modal="true" aria-labelledby="auth-title">
        <button id="auth-close-btn" class="auth-close-btn" type="button" aria-label="Close sign in">&times;</button>
        <div id="auth-signin-view">
          <h2 id="auth-title">Welcome back</h2>
          <p>Sign in to your Tourist Guide account.</p>
          <form id="auth-signin-form">
            <label>Email<input name="email" type="email" autocomplete="email" required></label>
            <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
            <button class="auth-submit-btn" type="submit">Sign in</button>
          </form>
          <p class="auth-switch-copy">Don't have an account? <button id="show-signup-btn" class="auth-switch-btn" type="button">Sign up</button></p>
        </div>
        <div id="auth-signup-view" hidden>
          <h2 id="auth-signup-title">Create your account</h2>
          <p>Save your details and explore places.</p>
          <form id="auth-signup-form">
            <label>Name<input name="name" type="text" autocomplete="given-name" maxlength="80" required></label>
            <label>Surname<input name="surname" type="text" autocomplete="family-name" maxlength="80" required></label>
            <label>Email<input name="email" type="email" autocomplete="email" required></label>
            <label>Password<input name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required><small>Use at least 8 characters.</small></label>
            <button class="auth-submit-btn" type="submit">Create account</button>
          </form>
          <p class="auth-switch-copy">Already have an account? <button id="show-signin-btn" class="auth-switch-btn" type="button">Sign in</button></p>
        </div>
        <p id="auth-feedback" class="auth-feedback" role="alert" aria-live="polite"></p>
      </section>
    </div>

    <!-- Add Destination Form -->
    <section class="add-form">
      <h2>Add a Destination</h2>
      <form id="add-destination-form">
        <input type="text" name="name" placeholder="Destination name" required>
        <input type="text" name="location" placeholder="Location" required>
        <select name="category" required>
          <option value="">Select category</option>
          <option value="food">Food</option>
          <option value="sightseeing">Sightseeing</option>
          <option value="nightlife">Nightlife</option>
          <option value="adventure">Adventure</option>
          <option value="nature">Nature</option>
        </select>
        <textarea name="description" placeholder="Description" required></textarea>
        <input type="number" name="rating" min="1" max="5" placeholder="Rating (1-5)" required>
        <input type="text" name="image_url" placeholder="Image URL (optional)">
        <button type="submit">Add Destination</button>
      </form>
    </section>

  </main>

  <script src="serpapi.js"></script>
  <script src="script.js"></script>
</body>
</html>
